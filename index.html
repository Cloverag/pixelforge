<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a12" />
  <meta name="description" content="PIXELFORGE - a pixel-art particle sandbox. Paint falling sand, play with physics toys, solve 7 challenges." />
  <title>PIXELFORGE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect width='8' height='8' fill='%230d0d16'/%3E%3Crect x='1' y='1' width='2' height='2' fill='%23f2a33c'/%3E%3Crect x='5' y='2' width='2' height='2' fill='%234fd1c5'/%3E%3Crect x='2' y='5' width='2' height='2' fill='%23e05252'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app">
    <header id="topbar" class="hidden"></header>
    <main id="stage">
      <div id="bezel">
        <div id="screen-wrap">
          <canvas id="screen" width="640" height="360"></canvas>
          <div id="view3d" class="hidden"></div>
          <div id="crt"></div>
          <div id="glass"></div>
        </div>
        <span id="led" aria-hidden="true"></span>
      </div>
    </main>
    <footer id="toolbar" class="hidden"></footer>
    <div id="overlay"></div>
  </div>
  <script>
    window.__bootErr = '';
    window.addEventListener('error', function (e) {
      window.__bootErr = ((e.error && e.error.stack) || e.message || 'unknown').slice(0, 900);
      document.title = 'BOOT ERR: ' + window.__bootErr;
    });
    window.addEventListener('unhandledrejection', function (e) {
      window.__bootErr = 'rejection: ' + (e.reason && e.reason.message || e.reason);
      document.title = 'BOOT REJ: ' + window.__bootErr;
    });
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
